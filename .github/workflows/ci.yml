name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            back-end-example-code-online-store/package-lock.json
            front-end-example-code-online-store/package-lock.json
      - run: npm ci
      - run: npm ci --prefix back-end-example-code-online-store
      - run: npm ci --prefix front-end-example-code-online-store
      - run: npm run build
      - run: npm audit --prefix back-end-example-code-online-store --audit-level=high
      - run: npm audit --prefix front-end-example-code-online-store --audit-level=high
